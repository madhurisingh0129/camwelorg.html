
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donut Chart</title>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #211e1c;
    font-family: Arial, sans-serif;
    padding: 30px;
}

.chart-box {
    width: 650px;
    min-height: 380px;
    padding: 40px;
    background: linear-gradient(120deg, #51433e, #080b0d);
    border: 1px solid #444;
    color: white;
}

.chart-box h3 {
    font-size: 15px;
    margin-bottom: 20px;
}

.chart-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 50px;
}

.donut-chart {
    width: 218px;
    height: 218px;
    border-radius: 50%;

    background: conic-gradient(
        #3568ce 0% 90.5%,
        #e43d18 90.5% 100%
    );

    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.donut-chart::before {
    content: "";
    width: 86px;
    height: 86px;
    background: #25201e;
    border-radius: 50%;
    position: absolute;
}

.blue-text {
    position: absolute;
    bottom: 25px;
    right: 35px;
    color: white;
    font-size: 13px;
    z-index: 1;
}

.red-text {
    position: absolute;
    top: 24px;
    left: 65px;
    color: white;
    font-size: 13px;
    z-index: 1;
}

.chart-legend {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
}

.legend-item p {
    font-size: 14px;
}

.blue-dot {
    width: 13px;
    height: 13px;
    background: #3568ce;
    border-radius: 50%;
}

.red-dot {
    width: 13px;
    height: 13px;
    background: #e43d18;
    border-radius: 50%;
}

    </style>
</head>
<body>

    <div class="chart-box">

        <h3>Total Business Activity</h3>

        <div class="chart-content">

            <div class="donut-chart">

                <span class="blue-text">90.5%</span>
                <span class="red-text">9.5%</span>

            </div>

            <div class="chart-legend">

                <div class="legend-item">
                    <span class="blue-dot"></span>
                    <p>Business</p>
                </div>

                <div class="legend-item">
                    <span class="red-dot"></span>
                    <p>Payout</p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
