<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            width: 100%;
        }

        .stats-section {
            width: 100%;
            min-height: 600px;
            background-color: rgb(185, 144, 144);
            position: relative;
            padding: 85px 1% 0;
        }

        .stats-container {
            background: linear-gradient(110deg,
                    #04399b,
                    #3467b9,
                    #939fb3);
            width: 70%;
            border: 2px solid darkblue;
            border-radius: 10px;
            display: grid;
            gap: 30px;
            grid-template-columns: 4, 1fr;
            align-items: center;
            text-align: center;
            color: azure;
            position: relative;

        }
        .stat-box h2 {
            gap: 10px;
            font-size: 40px;
            font-weight: bold;
        }

        .stat-box p {
            font-size: 20px;
            font-weight: bolder;
            flex-direction: column;
        }

    </style>
</head>

<body>

    <section class="stats-section">

        <div class="stats-container">

            <div class="stat-box">
                <h2>100+</h2>
                <p>Projects Done</p>
            </div>

            <div class="stat-box">
                <h2>5+</h2>
                <p>Awards Won</p>
            </div>

            <div class="stat-box">
                <h2>10+</h2>
                <p>Years Experience</p>
            </div>

            <div class="stat-box">
                <h2>100+</h2>
                <p>Happy Clients</p>
            </div>

        </div>

    </section>
</body>

</html>
