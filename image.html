<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Document</title>
    <style>
        .contenair {
            width: 100%;
            background-color: burlywood;
            padding: 20px 25px;
        }
        .image-box {
            width: 335px;
            height: 260px;
            position: relative;
            flex-shrink: 1;
        }

        .outer-img {
            width: 232px;
            height: 233px;
            top: 0;
            left: 0;
        }

        .inner-img {
            width: 150px;
            height: 130px;
            bottom: 20px;
            right: 10px;
            
        }
    </style>
</head>

<body>
    <div class="contenair">
        <div class="image-box">
            <div class="outer-img">
                <img src="https://plus.unsplash.com/premium_photo-1789164708566-cf0f80a0bd12?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                    alt="flower">
            </div>
            <div class="inner-img">
                <img src="https://images.unsplash.com/photo-1791893920857-3f388f13203a?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                    alt="flower">
            </div>
        </div>
    </div>

    </div>
    <h2>Image</h2>
    <p>In artificial intelligence and data science, flower image theory/classification deals with how machine
        learning models—specifically Convolutional Neural Networks (CNNs)—identify, categorize, and segment flower
        images.</p>
    <div img-icon>
        <i class="bi bi-check-circle-fill">yellow rose</i>
        <i class="bi bi-check-circle-fill">white rose</i>
        <i class="bi bi-check-circle-fill">black rose</i>
        <i class="bi bi-check-circle-fill">green rose</i>
    </div>
    </div>
</body>

</html>
